<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Desarrollo Colaborativo</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <header>
        <h1>DevHub Canarias</h1>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="servicios.html">Servicios</a></li>
                <li><a href="contacto.html" class="activo">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h2>Contacta con el Equipo</h2>
            <p>Rellena el siguiente formulario para solicitar información sobre nuestros proyectos.</p>
        </section>

        <form action="#" method="post">
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>

            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" name="correo" placeholder="nombre@ejemplo.com" required>

            <label for="mensaje">Mensaje</label>
            <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribe tu consulta aquí..." required></textarea>

            <button type="submit">Enviar consulta</button>
        </form>
    </main>

    <footer>
        <p>Práctica V - Entornos de Desarrollo &copy; 2026</p>
    </footer>
</body>
</html>
